<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050006">
    <meta name="description" content="El armario de Alina: guarda tu ropa y arma outfits que combinan.">
    <title>Alina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Rubik:wght@500;700&amp;display=block">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body data-pantalla="inicio">
    <!-- Dibujos compartidos: degradados de cromo, estrella Y2K, destello y mariposa -->
    <svg class="definiciones" aria-hidden="true">
      <defs>
        <linearGradient id="cromo-rosa" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe0f1"/>
          <stop offset="0.28" stop-color="#ff86c8"/>
          <stop offset="0.5" stop-color="#e0157f"/>
          <stop offset="0.56" stop-color="#7d0845"/>
          <stop offset="0.78" stop-color="#ff5cb2"/>
          <stop offset="1" stop-color="#ffd0ea"/>
        </linearGradient>
        <linearGradient id="cromo-plata" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff"/>
          <stop offset="0.4" stop-color="#e6e6ee"/>
          <stop offset="0.5" stop-color="#6f6f7c"/>
          <stop offset="0.58" stop-color="#2c2c35"/>
          <stop offset="0.75" stop-color="#d9d9e2"/>
          <stop offset="1" stop-color="#fff"/>
        </linearGradient>
        <path id="forma-estrella" d="M50 2 60 36.2 95.6 35.2 66.2 55.3 78.2 88.8 50 67 21.8 88.8 33.8 55.3 4.4 35.2 40 36.2Z"/>
        <g id="estrella-doble">
          <use href="#forma-estrella" fill="none" stroke="url(#cromo-rosa)" stroke-width="4" transform="translate(50 50) scale(1.18) translate(-50 -50)"/>
          <use href="#forma-estrella" fill="url(#cromo-rosa)" stroke="#ffd0ea" stroke-width="1.5" transform="translate(50 52) scale(0.72) translate(-50 -50)"/>
        </g>
        <symbol id="estrella-y2k" viewBox="-12 -12 150 150">
          <use href="#estrella-doble"/>
          <use href="#estrella-doble" transform="translate(-4 72) scale(0.42)"/>
          <use href="#estrella-doble" transform="translate(66 78) scale(0.36)"/>
        </symbol>
        <symbol id="destello" viewBox="0 0 24 24">
          <path d="M12 0c.6 6.5 5.5 11.4 12 12-6.5.6-11.4 5.5-12 12-.6-6.5-5.5-11.4-12-12C6.5 11.4 11.4 6.5 12 0Z" fill="url(#cromo-plata)" stroke="#ff86c8" stroke-width="1.2"/>
        </symbol>
        <path id="ala-arriba" d="M100 68C82 22 30-2 14 22 0 44 34 72 100 72Z"/>
        <path id="ala-abajo" d="M100 76C66 76 28 92 34 118c6 22 48 12 66-38Z"/>
        <g id="alas-izquierdas">
          <use href="#ala-arriba" fill="url(#cromo-rosa)" stroke="url(#cromo-plata)" stroke-width="7"/>
          <use href="#ala-abajo" fill="url(#cromo-rosa)" stroke="url(#cromo-plata)" stroke-width="7"/>
        </g>
        <g id="cuerpo-mariposa">
          <path d="M97 40c-4-14-10-22-18-26M103 40c4-14 10-22 18-26" fill="none" stroke="#e6e6ee" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="100" cy="76" rx="7" ry="36" fill="url(#cromo-plata)" stroke="#7d0845" stroke-width="2"/>
        </g>
      </defs>
    </svg>

    <header class="encabezado">
      <svg class="decoracion estrellas-grandes" aria-hidden="true"><use href="#estrella-y2k"/></svg>
      <svg class="decoracion estrellas-chicas" aria-hidden="true"><use href="#estrella-y2k"/></svg>
      <h1 class="nombre cromo" data-texto="Alina"><span>Alina</span></h1>
      <div class="destellos" aria-hidden="true">
        <svg class="destello"><use href="#destello"/></svg>
        <svg class="destello"><use href="#destello"/></svg>
        <svg class="destello"><use href="#destello"/></svg>
        <svg class="destello"><use href="#destello"/></svg>
      </div>
    </header>

    <main class="contenido">
      <section id="pantalla-inicio" class="pantalla" aria-label="Outfit del momento">
        <div class="outfit" id="outfit">
          <div class="prendas" id="prendas">
            <figure class="prenda prenda-arriba">
              <span class="prenda-icono" aria-hidden="true">👚</span>
              <figcaption>Arriba</figcaption>
            </figure>
            <figure class="prenda prenda-extra">
              <span class="prenda-icono" aria-hidden="true">👜</span>
              <figcaption>Extra</figcaption>
            </figure>
            <figure class="prenda prenda-abajo">
              <span class="prenda-icono" aria-hidden="true">👖</span>
              <figcaption>Abajo</figcaption>
            </figure>
            <figure class="prenda prenda-zapatos">
              <span class="prenda-icono" aria-hidden="true">👟</span>
              <figcaption>Zapatos</figcaption>
            </figure>
          </div>
          <p class="outfit-pista" id="outfit-pista" aria-live="polite">Aprieta <strong>Alina</strong> y aquí aparece tu outfit ✦</p>
          <a class="boton boton-secundario" id="outfit-agregar" href="#agregar" hidden>+ Agregar prendas</a>
        </div>
      </section>

      <section id="pantalla-armario" class="pantalla" aria-labelledby="titulo-armario" hidden>
        <h2 id="titulo-armario" class="titulo cromo" tabindex="-1" data-texto="Mi armario"><span>Mi armario</span></h2>
        <div class="filtros" role="group" aria-label="Filtrar por categoría">
          <button class="chip" type="button" aria-pressed="true">Todo</button>
          <button class="chip" type="button" aria-pressed="false">Arriba</button>
          <button class="chip" type="button" aria-pressed="false">Abajo</button>
          <button class="chip" type="button" aria-pressed="false">Vestidos</button>
          <button class="chip" type="button" aria-pressed="false">Zapatos</button>
          <button class="chip" type="button" aria-pressed="false">Abrigos</button>
          <button class="chip" type="button" aria-pressed="false">Accesorios</button>
        </div>
        <p class="vacio">Todavía no hay prendas. ¡Agrega la primera!</p>
        <a class="boton" href="#agregar">+ Agregar prenda</a>
      </section>

      <section id="pantalla-agregar" class="pantalla" aria-labelledby="titulo-agregar" hidden>
        <h2 id="titulo-agregar" class="titulo cromo" tabindex="-1" data-texto="Agregar prenda"><span>Agregar prenda</span></h2>
        <form class="formulario" id="form-prenda">
          <label class="foto" id="foto" for="foto-prenda">
            <span class="foto-texto">Tocar para tomar una foto</span>
          </label>
          <input class="foto-input" id="foto-prenda" name="foto" type="file" accept="image/*" capture="environment">

          <label class="campo">
            <span>Categoría</span>
            <select name="categoria" required>
              <option value="" disabled selected>Elegir…</option>
              <option value="arriba">Parte de arriba</option>
              <option value="abajo">Parte de abajo</option>
              <option value="vestido">Vestido / enterito</option>
              <option value="zapatos">Zapatos</option>
              <option value="abrigo">Abrigo</option>
              <option value="accesorio">Accesorio</option>
            </select>
          </label>

          <fieldset class="campo">
            <legend>Estilo</legend>
            <div class="opciones">
              <label class="opcion"><input type="checkbox" name="estilo" value="casual"> Casual</label>
              <label class="opcion"><input type="checkbox" name="estilo" value="elegante"> Elegante</label>
              <label class="opcion"><input type="checkbox" name="estilo" value="deportivo"> Deportivo</label>
              <label class="opcion"><input type="checkbox" name="estilo" value="fiesta"> Fiesta</label>
            </div>
          </fieldset>

          <label class="campo campo-color">
            <span>Color principal</span>
            <input type="color" name="color" value="#ff8fd1">
          </label>

          <label class="campo">
            <span>Conjunto (opcional)</span>
            <input type="text" name="conjunto" placeholder="Ej.: set rosado" autocomplete="off">
          </label>

          <p class="aviso" id="aviso-prenda" role="status"></p>
          <button class="boton" type="submit">Guardar prenda</button>
          <a class="boton boton-secundario" href="#armario">Cancelar</a>
        </form>
      </section>

      <section id="pantalla-favoritos" class="pantalla" aria-labelledby="titulo-favoritos" hidden>
        <h2 id="titulo-favoritos" class="titulo cromo" tabindex="-1" data-texto="Favoritos"><span>Favoritos</span></h2>
        <p class="vacio">Cuando te guste un outfit, tócale el corazón y aparecerá aquí 💖</p>
      </section>
    </main>

    <button class="boton-alina" id="boton-alina" type="button" aria-describedby="outfit-pista">
      <span class="cromo cromo-boton" data-texto="Alina"><span>Alina</span></span>
      <svg class="posada posada-1" viewBox="0 0 200 140" aria-hidden="true">
        <g class="ala"><use href="#alas-izquierdas"/></g>
        <g class="ala"><use href="#alas-izquierdas" transform="translate(200 0) scale(-1 1)"/></g>
        <use href="#cuerpo-mariposa"/>
      </svg>
      <svg class="posada posada-2" viewBox="0 0 200 140" aria-hidden="true">
        <g class="ala"><use href="#alas-izquierdas"/></g>
        <g class="ala"><use href="#alas-izquierdas" transform="translate(200 0) scale(-1 1)"/></g>
        <use href="#cuerpo-mariposa"/>
      </svg>
    </button>

    <nav class="barra" aria-label="Secciones">
      <a class="barra-enlace" href="#armario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9V11l9 6.2a1 1 0 0 1-.6 1.8H3.6a1 1 0 0 1-.6-1.8L12 11"/></svg>
        Armario
      </a>
      <a class="barra-enlace" href="#inicio" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        Inicio
      </a>
      <a class="barra-enlace" href="#favoritos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>
        Favoritos
      </a>
    </nav>
  </body>
</html>
